stages:
  - build
  - publish
  - docker

variables:
  NODE_ENV: production
  # Ensure pnpm store is local to enable caching
  PNPM_STORE_DIR: .pnpm-store
  # Increase memory during builds
  NODE_OPTIONS: --max_old_space_size=4096

.default_pnpm_setup: &default_pnpm_setup
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - .nx/cache/
  before_script:
    - export PNPM_HOME="$CI_PROJECT_DIR/.pnpm-home"
    - export PATH="$PNPM_HOME:$PATH"
    - |
      if ! command -v pnpm >/dev/null 2>&1; then
        echo "Installing pnpm to $PNPM_HOME"
        curl -fsSL https://get.pnpm.io/install.sh | env PNPM_HOME="$PNPM_HOME" PNPM_VERSION=9.12.0 sh -
      fi
    - pnpm --version
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile --prefer-offline

build:react-kit:
  stage: build
  tags:
    - k3-runner-1
  needs: []
  <<: *default_pnpm_setup
  script:
    - pnpm nx build @k3-universe/react-kit
  artifacts:
    expire_in: 1 week
    paths:
      - libs/react-kit/dist/
  rules:
    - if: '$CI_COMMIT_TAG'

build:storybook:
  stage: build
  tags:
    - k3-runner-1
  needs: []
  <<: *default_pnpm_setup
  script:
    - pnpm nx run @k3-universe/react-kit:build-storybook
  artifacts:
    expire_in: 1 week
    paths:
      - libs/react-kit/storybook-static/
  rules:
    - changes:
        - libs/react-kit/**/*
        - package.json
        - pnpm-lock.yaml
        - nx.json
        - tsconfig*.json

release:react-kit:
  stage: publish
  tags:
    - k3-runner-1
  needs:
    - job: build:react-kit
      artifacts: true
  <<: *default_pnpm_setup
  script:
    # Auth for npmjs.com (expects NPM_TOKEN in CI/CD variables)
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    # Publish only on tag pipelines; set version from tag and publish package in libs/react-kit
    - cd libs/react-kit
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        echo "Setting package version to $VERSION from tag $CI_COMMIT_TAG"
        npm version "$VERSION" --no-git-tag-version
      fi
    - test -f dist/index.js || { echo "dist not found; did build stage run?"; exit 1; }
    - npm publish
  rules:
    - if: '$CI_COMMIT_TAG'

# Build and push a Docker image serving Storybook static files via Nginx
storybook:docker-image:
  stage: docker
  tags:
    - k3-runner-1
  needs:
    - job: build:storybook
      artifacts: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE/react-kit-storybook"
    # Ensure the build output exists at libs/react-kit/storybook-static
    - |
      if [ ! -f libs/react-kit/storybook-static/index.html ]; then
        echo "storyboard-static not found in libs/react-kit; trying dist locations..."
        CANDIDATE_DIR=$(find dist -type f -name index.html -path "*storybook*" -printf '%h' -quit 2>/dev/null || true)
        if [ -n "$CANDIDATE_DIR" ]; then
          echo "Copying $CANDIDATE_DIR -> libs/react-kit/storybook-static"
          rm -rf libs/react-kit/storybook-static
          mkdir -p libs/react-kit/storybook-static
          cp -r "$CANDIDATE_DIR/"* libs/react-kit/storybook-static/
        fi
      fi
      test -f libs/react-kit/storybook-static/index.html || { echo "Storybook static output not found"; exit 1; }
    - docker build -f libs/react-kit/Dockerfile.storybook -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" libs/react-kit
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    # Tag latest on default branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi
    # Tag with git tag when present
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
      fi
  rules:
    - changes:
        - libs/react-kit/**/*
        - package.json
        - pnpm-lock.yaml
        - nx.json
        - tsconfig*.json
