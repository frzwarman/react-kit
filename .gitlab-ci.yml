release:affected:
  stage: publish
  tags:
    - pensieve-runner-1
  needs:
    - job: build:affected
      artifacts: true
    - job: detect:affected
  <<: *default_pnpm_setup
  variables:
    GIT_DEPTH: 0
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      if [ -z "$AFFECTED_PROJECTS" ]; then
        echo "No affected projects to release"; exit 0;
      fi
      echo "Releasing version $VERSION for: $AFFECTED_PROJECTS"
      for PROJ in $AFFECTED_PROJECTS; do
        echo "Resolving root for $PROJ"
        ROOT=$(pnpm nx show project "$PROJ" --json | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>console.log(JSON.parse(s).root));")
        if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
          echo "Failed to resolve root for $PROJ"; exit 1;
        fi
        echo "Publishing $PROJ from $ROOT"
        cd "$ROOT"
        npm version "$VERSION" --no-git-tag-version
        test -f dist/index.js || { echo "dist not found for $PROJ"; exit 1; }
        npm publish
        cd "$CI_PROJECT_DIR"
      done
  rules:
    - if: '$CI_COMMIT_TAG'

