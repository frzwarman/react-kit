stages:
  - build
  - publish
  - docker

variables:
  NODE_ENV: production
  # Ensure pnpm store is local to enable caching
  PNPM_STORE_DIR: .pnpm-store
  # Increase memory during builds
  NODE_OPTIONS: --max_old_space_size=4096

.default_pnpm_setup: &default_pnpm_setup
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - .nx/cache/
  before_script:
    - export PNPM_HOME="$CI_PROJECT_DIR/.pnpm-home"
    - export PATH="$PNPM_HOME:$PATH"
    - |
      if ! command -v pnpm >/dev/null 2>&1; then
        echo "Installing pnpm to $PNPM_HOME"
        curl -fsSL https://get.pnpm.io/install.sh | env PNPM_HOME="$PNPM_HOME" PNPM_VERSION=9.12.0 sh -
      fi
    - pnpm --version
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile --prefer-offline

detect:affected:
  stage: build
  tags:
    - pensieve-runner-1
  needs: []
  <<: *default_pnpm_setup
  variables:
    GIT_DEPTH: 0
  script:
    - |
      # Determine previous tag (if any) and compute Nx affected
      CURRENT_TAG="$CI_COMMIT_TAG"
      echo "Current tag: $CURRENT_TAG"
      PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
      if [ -z "$PREV_TAG" ]; then
        BASE=$(git rev-list --max-parents=0 HEAD)
      else
        BASE="$PREV_TAG"
      fi
      HEAD="$CI_COMMIT_SHA"
      echo "Using base=$BASE head=$HEAD"
      AFFECTED=$(pnpm nx print-affected --target=build --base="$BASE" --head="$HEAD" --select=projects || true)
      # normalize to single-line space-separated list
      AFFECTED=$(echo "$AFFECTED" | tr '\n' ' ' | xargs)
      echo "AFFECTED_PROJECTS=$AFFECTED" | tee affected.env
      echo "NX_BASE=$BASE" >> affected.env
      echo "NX_HEAD=$HEAD" >> affected.env
  artifacts:
    reports:
      dotenv: affected.env
  rules:
    - if: '$CI_COMMIT_TAG'

build:affected:
  stage: build
  tags:
    - pensieve-runner-1
  needs:
    - job: detect:affected
  <<: *default_pnpm_setup
  script:
    - |
      if [ -z "$AFFECTED_PROJECTS" ]; then
        echo "No affected projects to build";
        # Create a placeholder so artifacts collection does not fail with 'No files to upload'
        mkdir -p libs/.artifacts-keep/dist
        echo "noop" > libs/.artifacts-keep/dist/.keep
        exit 0;
      fi
      echo "Building: $AFFECTED_PROJECTS"
      PROJECTS_CSV=$(echo "$AFFECTED_PROJECTS" | tr ' ' ',')
      pnpm nx run-many -t build --projects="$PROJECTS_CSV" --parallel=1
  artifacts:
    expire_in: 1 week
    paths:
      - libs/**/dist/
      - dist/libs/**
  rules:
    - if: '$CI_COMMIT_TAG'

